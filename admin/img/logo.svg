<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4e73df;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#224abe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1cc88a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#13855c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="url(#grad1)" filter="url(#shadow)" />
  <!-- ID Badge Lanyard Slot -->
  <rect x="80" y="32" width="40" height="8" rx="4" fill="#ffffff" opacity="0.3" />
  <!-- User Profile Silhouette -->
  <circle cx="100" cy="82" r="24" fill="#ffffff" />
  <path d="M55,146 C55,118 75,112 100,112 C125,112 145,118 145,146 Z" fill="#ffffff" />
  <!-- Clock / Attendance Badge -->
  <circle cx="140" cy="140" r="30" fill="url(#accentGrad)" filter="url(#shadow)" stroke="#ffffff" stroke-width="3" />
  <!-- Clock Hands -->
  <polyline points="140,123 140,140 152,146" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
